name: ci/cd pipeline with sonarqube

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. checkout source code
      - name: checkout source code
        uses: actions/checkout@v5

      # 2. setup java 17
      - name: set-up java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. validate
      - name: validate
        run: mvn validate

      # 4. compile
      - name: compile
        run: mvn compile

      # 5. test
      - name: test
        run: mvn test

      # 6. package
      - name: package
        run: mvn package

      # 7. verify war file
      - name: verify the war file
        run: ls -lh target/

      # 8. sonarqube scan
      - name: sonarqube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=train \
            -Dsonar.projectName=TrainBook \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
