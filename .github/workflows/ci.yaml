name: ci/cd pipeline to deploy tomcat
on:
 push:
  branches: master
jobs:
 build-deploy:
  runs-on: ubuntu-latest
  steps:
   - name: checkout code
     uses: actions/checkout@v5
   - name: set-up jdk
     uses: actions/setup-java@v5
     with:
      distribution: "temurin"
      java-version: '17'
   - name: validate with maven
     run: mvn validate
   - name: compile with maven
     run: mvn compile
   - name: test with maven
     run: mvn test
   - name: package with maven
     run: mvn package
   - name: verify the war file
     run: ls -lh target/
    #sonarqube scan
   - name: Build, Test and sonarqube scan
     env: 
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
     run: |
      mvn org.sonar.source.scanner.maven:sonar-maven-plugin:5.1.0.475:sonar \
       -Dsonar.projectkey=train \
       -Dsonar.projectName=TrainBook \
       -Dsonar.host.url="$SONAR_HOST_URL" \
       -Dsonar.login="$SONAR_TOKEN"
