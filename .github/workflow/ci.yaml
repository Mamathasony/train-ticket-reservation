name: ci pipeline to deploy maven
on:
 push:
  branches: master
jobs:
 build-deploy:
  runs-on: ubuntu-latest
  steps:
   - name: checkout code
     uses: actions/checkout@v3
   - name: set-up jdk
     uses: actions/setup-jdk@v3
     with:
      distribution: "temurin"
      java-version: '17'
   - name: validate with maven
     run: mvn validate
   - name: compile with maven
     run: mvn compile
   - name: test with maven
     run: mvn test
   - name: package with the maven
     run: mvn package
   - name: verify the war file
     run: ls -lh taget/
     
